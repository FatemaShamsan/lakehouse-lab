# Gateway API objects served by Envoy Gateway (same pattern as the company cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: eg}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: lakehouse-gw, namespace: lakehouse}
spec:
  gatewayClassName: eg
  listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: Same}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: trino, namespace: lakehouse}
spec:
  parentRefs: [{name: lakehouse-gw}]
  hostnames: ["trino.localtest.me"]   # *.localtest.me resolves to 127.0.0.1
  rules:
    - backendRefs: [{name: trino, port: 8080}]
