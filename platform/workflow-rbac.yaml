# Permissions for pods started by Argo Workflows (they must report their results back).
apiVersion: v1
kind: ServiceAccount
metadata: {name: workflow-runner, namespace: lakehouse}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: workflow-runner, namespace: lakehouse}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: workflow-runner, namespace: lakehouse}
subjects: [{kind: ServiceAccount, name: workflow-runner, namespace: lakehouse}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workflow-runner}
