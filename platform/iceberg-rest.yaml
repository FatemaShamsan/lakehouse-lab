# Iceberg REST catalog (in memory). Stands in for Apache Polaris on a laptop.
apiVersion: apps/v1
kind: Deployment
metadata: {name: iceberg-rest, namespace: lakehouse}
spec:
  replicas: 1
  selector: {matchLabels: {app: iceberg-rest}}
  template:
    metadata: {labels: {app: iceberg-rest}}
    spec:
      containers:
        - name: rest
          image: apache/iceberg-rest-fixture:latest   # pin a tested tag once chosen
          envFrom: [{secretRef: {name: s3-credentials}}]
          env:
            - {name: CATALOG_WAREHOUSE, value: "s3://warehouse/"}
            - {name: CATALOG_IO__IMPL, value: "org.apache.iceberg.aws.s3.S3FileIO"}
            - {name: CATALOG_S3_ENDPOINT, value: "http://localstack:4566"}
            - {name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true"}
          ports: [{containerPort: 8181}]
          readinessProbe: {httpGet: {path: /v1/config, port: 8181}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: iceberg-rest, namespace: lakehouse}
spec:
  selector: {app: iceberg-rest}
  ports: [{port: 8181}]
